# Deploys the Shopify side of Colvy (shopify/: app configuration + the theme
# app extension) to the Colvy app in the Shopify Dev Dashboard — no terminal
# needed. Runs when anything under shopify/ changes on main, or by hand from
# GitHub → Actions → "Deploy Shopify app" → Run workflow.
#
# Needs one repository secret, SHOPIFY_APP_AUTOMATION_TOKEN: Dev Dashboard →
# Colvy → Settings → App automation token → Create (it expires; rotate there).
#
# The privately shared app (shopify.app.private.toml) is deployed too once its
# Client ID is filled in and SHOPIFY_PRIVATE_APP_AUTOMATION_TOKEN is set (the
# same kind of token, from Dev Dashboard → Colvy (private)).
name: Deploy Shopify app

on:
  push:
    branches: [main]
    paths:
      - 'shopify/**'
      - '.github/workflows/shopify-deploy.yml'
  workflow_dispatch:

concurrency:
  group: shopify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopify
    env:
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is set
        id: token
        run: |
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then
            echo "::warning::Add the SHOPIFY_APP_AUTOMATION_TOKEN repository secret (Dev Dashboard → Colvy → Settings → App automation token) to deploy the Shopify app."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm install --no-audit --no-fund

      - name: Build the storefront script
        if: steps.token.outputs.ok == 'true'
        run: npm run build

      - name: Deploy to Shopify
        if: steps.token.outputs.ok == 'true'
        env:
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: npx --yes @shopify/cli@latest app deploy --allow-updates --source-control-url "$COMMIT_URL"

      - name: Deploy the private app
        if: steps.token.outputs.ok == 'true'
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_PRIVATE_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ] || grep -q PASTE_PRIVATE_APP_CLIENT_ID shopify.app.private.toml; then
            echo "Private app not set up (Client ID in shopify.app.private.toml + SHOPIFY_PRIVATE_APP_AUTOMATION_TOKEN); skipping."
            exit 0
          fi
          npx --yes @shopify/cli@latest app deploy --config private --allow-updates --source-control-url "$COMMIT_URL"
