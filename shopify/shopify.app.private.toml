# Colvy (private) — the privately shared copy of the Colvy app.
#
# Shopify "custom distribution": installed with a link the Dev Dashboard makes
# for ONE store (or the stores of one Plus organisation), no App Store review.
# Colvy uses it to connect a store while the public app is in review
# (lib/shopify-auth.ts; setup steps in shopify/README.md → "Private app").
#
# Same URLs, scopes, webhooks, app proxy and theme extension as the public app
# (keep it in step with shopify.app.toml). Deploy with:
#   npx @shopify/cli@latest app deploy --config private
#
# `client_id` is the private app's Client ID, the same value as
# SHOPIFY_CUSTOM_API_KEY in Vercel. Paste it below.

client_id = "PASTE_PRIVATE_APP_CLIENT_ID"
name = "Colvy (private)"
handle = "colvy-private"
application_url = "https://colvy.com/api/shopify/app"
embedded = false

[access_scopes]
# Keep in step with SHOPIFY_SCOPES in lib/shopify-auth.ts.
scopes = "read_customers,write_customers,read_orders,write_orders,write_order_edits,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_draft_orders,write_draft_orders,read_products,read_inventory,read_locations,read_discounts,write_discounts"

[auth]
redirect_urls = [ "https://colvy.com/api/shopify/callback" ]

[webhooks]
api_version = "2026-10"

# Required for every app: customer data requests and erasure. Store topics
# (orders, products, checkouts…) are subscribed per store by Colvy itself.
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://colvy.com/api/webhooks/shopify"

# The storefront "Notify me" form posts to https://{store}/apps/colvy/waitlist;
# Shopify signs it and forwards it to Colvy.
[app_proxy]
url = "https://colvy.com/api/shopify/proxy"
subpath = "colvy"
prefix = "apps"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true
